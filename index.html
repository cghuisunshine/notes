<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e8">
  <title>Notes</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f1e8;
      --sidebar: #eee7db;
      --paper: #fffdf8;
      --ink: #28241f;
      --muted: #756e64;
      --faint: #9a9185;
      --line: #d8d0c3;
      --line-strong: #bcb2a4;
      --accent: #7d4c36;
      --accent-soft: #eadbd1;
      --hover: #e7dfd3;
      --danger: #a13f34;
      --focus: rgba(125, 76, 54, 0.24);

      /* Latin first, then CJK — so English keeps Avenir and Chinese
         falls to a proper Han face instead of a default fallback. */
      --font-ui: "Avenir Next", Avenir, "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Heiti SC",
                 "Source Han Sans SC", "Noto Sans CJK SC", "Noto Sans SC",
                 "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      --font-read: "Avenir Next", Avenir, "Helvetica Neue",
                   "PingFang SC", "Hiragino Sans GB", "Heiti SC",
                   "Source Han Sans SC", "Noto Sans CJK SC", "Noto Sans SC",
                   "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --page: #181715;
      --sidebar: #211f1c;
      --paper: #25231f;
      --ink: #eee9df;
      --muted: #aaa297;
      --faint: #847c71;
      --line: #403c36;
      --line-strong: #5b554c;
      --accent: #d29a7c;
      --accent-soft: #49352b;
      --hover: #302d28;
      --danger: #eb8b7f;
      --focus: rgba(210, 154, 124, 0.22);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      /* CJK punctuation compression + correct Simplified Chinese glyph forms */
      font-variant-east-asian: simplified;
      font-kerning: normal;
    }

    button, input { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    input:focus-visible,
    canvas:focus-visible,
    [contenteditable]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 1px;
    }

    .app {
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr);
      height: 100%;
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .sidebar-header {
      height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .app-name {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .icon-button,
    .toolbar-button,
    .text-button {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .icon-button:hover,
    .toolbar-button:hover,
    .text-button:hover { background: var(--hover); }

    .icon-button svg,
    .toolbar-button svg { width: 18px; height: 18px; }

    .search-wrap {
      position: relative;
      padding: 12px 12px 8px;
    }

    .search-wrap svg {
      position: absolute;
      left: 23px;
      top: 22px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 36px;
      padding: 0 32px 0 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }

    #search::placeholder { color: var(--faint); }

    #clearSearch {
      display: none;
      position: absolute;
      right: 18px;
      top: 18px;
      width: 25px;
      height: 25px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    #clearSearch.visible { display: block; }

    .note-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 8px 12px;
    }

    .note-item {
      width: 100%;
      padding: 10px 11px 9px;
      display: block;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .note-item:hover { background: var(--hover); }

    .note-item.active {
      border-left-color: var(--accent);
      background: var(--accent-soft);
    }

    .note-item-title {
      display: block;
      overflow: hidden;
      font-weight: 600;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-item-preview {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list-empty {
      padding: 24px 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .sidebar-footer {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
    }

    .sidebar-footer .text-button {
      padding: 7px 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .editor-shell {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }

    .topbar {
      height: 58px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .menu-button { display: none; }

    .save-status {
      margin-right: auto;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .topbar-divider {
      width: 1px;
      height: 20px;
      background: var(--line);
    }

    .editor-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .document {
      width: min(760px, calc(100% - 56px));
      min-height: 100%;
      margin: 0 auto;
      padding: 54px 0 120px;
    }

    #title {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-read);
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 670;
      line-height: 1.32;
      /* was -0.035em: tight Latin tracking crushes Han characters */
      letter-spacing: -0.01em;
    }

    #title::placeholder { color: var(--line-strong); }
    #title:focus { outline: 0; }

    .note-meta {
      min-height: 22px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .format-toolbar {
      margin: 24px 0 26px;
      padding: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--page);
    }

    .toolbar-button {
      min-width: 32px;
      height: 31px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      font-size: 13px;
      font-weight: 600;
    }

    .toolbar-button.active {
      border-color: var(--line-strong);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .handwriting-panel {
      margin: -14px 0 26px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .handwriting-panel[hidden] { display: none; }

    .handwriting-controls {
      min-height: 43px;
      padding: 5px 7px 5px 11px;
      display: flex;
      align-items: center;
      gap: 3px;
      border-bottom: 1px solid var(--line);
      background: var(--page);
    }

    .handwriting-label {
      margin-right: auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .handwriting-controls .toolbar-button:disabled {
      color: var(--faint);
      cursor: default;
      opacity: 0.55;
    }

    .handwriting-controls .toolbar-button:disabled:hover { background: transparent; }

    .canvas-wrap {
      position: relative;
      height: 360px;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 35px,
        var(--line) 36px
      );
    }

    #handwritingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    #handwritingCanvas.eraser-active { cursor: cell; }

    .toolbar-separator {
      width: 1px;
      height: 20px;
      margin: 0 4px;
      background: var(--line);
    }

    #editor {
      min-height: 380px;
      color: var(--ink);
      font-family: var(--font-read);
      font-size: 17px;
      /* CJK needs more leading than Latin at the same size */
      line-height: 1.9;
      /* Break long unbroken Latin/URLs, but keep normal CJK line breaking
         and never split an ordinary English word. */
      overflow-wrap: break-word;
      word-break: normal;
      line-break: strict;
      /* Don't strand CJK closing punctuation at the start of a line */
      hanging-punctuation: allow-end;
      text-spacing-trim: trim-start;
    }

    /* Automatic gap between Han characters and adjacent Latin/digits
       (the "汉字 abc 123" spacing rule) where the engine supports it. */
    #editor, #title, .note-item-title, .note-item-preview {
      text-autospace: normal;
    }

    #editor:focus { outline: 0; }

    #editor:empty::before {
      content: attr(data-placeholder);
      color: var(--faint);
      pointer-events: none;
    }

    #editor p { margin: 0 0 0.9em; }
    #editor h2 { margin: 1.4em 0 0.5em; font-size: 1.45em; line-height: 1.45; font-weight: 650; }
    #editor h3 { margin: 1.25em 0 0.45em; font-size: 1.15em; line-height: 1.5; font-weight: 650; }
    #editor ul, #editor ol { margin: 0.4em 0 1em; padding-left: 1.6em; }
    #editor blockquote { margin: 1em 0; padding-left: 16px; border-left: 3px solid var(--line-strong); color: var(--muted); }
    #editor a { color: var(--accent); }
    #editor hr { margin: 2em 0; border: 0; border-top: 1px solid var(--line); }

    .empty-editor {
      flex: 1;
      display: none;
      place-items: center;
      color: var(--muted);
      background: var(--paper);
    }

    .empty-editor.visible { display: grid; }
    .editor-shell.no-note .editor-scroll { display: none; }

    .empty-editor-content { text-align: center; }
    .empty-editor-content p { margin: 0 0 14px; }

    .primary-button {
      padding: 8px 13px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: var(--paper);
      font-weight: 600;
      cursor: pointer;
    }

    .primary-button:hover { filter: brightness(0.95); }

    .backdrop { display: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }

      .sidebar {
        position: fixed;
        z-index: 20;
        inset: 0 auto 0 0;
        width: min(290px, 86vw);
        transform: translateX(-101%);
        transition: transform 160ms ease;
      }

      .sidebar.open { transform: translateX(0); }
      .menu-button { display: inline-grid; }

      .backdrop {
        position: fixed;
        z-index: 15;
        inset: 0;
        border: 0;
        background: rgba(24, 23, 21, 0.42);
      }

      .backdrop.visible { display: block; }
      .topbar { padding: 0 10px; }
      .document { width: calc(100% - 36px); padding-top: 34px; }
      .save-status { overflow: hidden; text-overflow: ellipsis; }
      .topbar-divider { display: none; }
      .canvas-wrap { height: 280px; }
    }

    @media print {
      body { overflow: visible; background: #fff; }
      .app { display: block; height: auto; }
      .sidebar, .topbar, .format-toolbar, .handwriting-controls { display: none !important; }
      .editor-shell, .editor-scroll { display: block !important; overflow: visible; }
      .document { width: 100%; padding: 0; }
      #title { color: #111; }
      #editor { color: #111; line-height: 1.8; }
      #editor h2, #editor h3 { break-after: avoid; page-break-after: avoid; }
      #editor p, #editor li, #editor blockquote { orphans: 2; widows: 2; }
      .handwriting-panel { margin: 18px 0 24px; border-color: #bbb; }
      .handwriting-panel.has-ink[hidden] { display: block !important; }
      .handwriting-panel:not(.has-ink) { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Notes sidebar">
      <header class="sidebar-header">
        <p class="app-name">Notes</p>
        <button class="icon-button" id="newNote" type="button" title="New note (⌘⇧N)" aria-label="Create new note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <label class="sr-only" for="search">Search notes</label>
        <input id="search" type="search" placeholder="Search notes" autocomplete="off">
        <button id="clearSearch" type="button" aria-label="Clear search">×</button>
      </div>

      <nav class="note-list" id="noteList" aria-label="All notes"></nav>

      <footer class="sidebar-footer">
        <button class="text-button" id="exportNotes" type="button">Export</button>
        <button class="text-button" id="importNotes" type="button">Import</button>
        <input class="sr-only" id="importFile" type="file" accept="application/json,.json">
      </footer>
    </aside>

    <button class="backdrop" id="backdrop" type="button" aria-label="Close notes sidebar"></button>

    <main class="editor-shell" id="editorShell">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Open notes sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="save-status" id="saveStatus" role="status" aria-live="polite">Saved locally</span>
        <button class="icon-button" id="themeButton" type="button" title="Change theme" aria-label="Switch to dark theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
        </button>
        <button class="icon-button" id="printNote" type="button" title="Print note" aria-label="Print current note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 9V3h10v6M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
        </button>
        <div class="topbar-divider" aria-hidden="true"></div>
        <button class="icon-button" id="deleteNote" type="button" title="Delete note" aria-label="Delete current note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>
        </button>
      </header>

      <div class="editor-scroll" id="editorScroll">
        <article class="document">
          <label class="sr-only" for="title">Note title</label>
          <input id="title" type="text" placeholder="Untitled" autocomplete="off">
          <div class="note-meta" id="noteMeta"></div>

          <div class="format-toolbar" id="formatToolbar" role="toolbar" aria-label="Text formatting">
            <button class="toolbar-button" type="button" data-command="bold" title="Bold (⌘B)" aria-label="Bold"><strong>B</strong></button>
            <button class="toolbar-button" type="button" data-command="italic" title="Italic (⌘I)" aria-label="Italic"><em>I</em></button>
            <button class="toolbar-button" type="button" data-command="underline" title="Underline (⌘U)" aria-label="Underline"><u>U</u></button>
            <button class="toolbar-button" type="button" data-command="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button class="toolbar-button" type="button" data-block="h2" title="Heading" aria-label="Heading">H2</button>
            <button class="toolbar-button" type="button" data-block="p" title="Paragraph" aria-label="Paragraph">¶</button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button class="toolbar-button" type="button" data-command="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="toolbar-button" type="button" data-command="insertOrderedList" title="Numbered list" aria-label="Numbered list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M4 5h2v3M4 11h2l-2 3h2M4 17h2v3H4"/></svg>
            </button>
            <button class="toolbar-button" type="button" data-block="blockquote" title="Quote" aria-label="Block quote">“</button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button class="toolbar-button" type="button" data-command="removeFormat" title="Clear formatting" aria-label="Clear formatting">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m4 4 16 16M8 4h10M13 4l-2.1 5.2M7.5 17H4l4-9"/></svg>
            </button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button class="toolbar-button" id="toggleHandwriting" type="button" title="Handwriting canvas" aria-label="Open handwriting canvas" aria-expanded="false" aria-controls="handwritingPanel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m4 20 4.2-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m13.8 7.4 3 3M4 20h16"/></svg>
            </button>
          </div>

          <section class="handwriting-panel" id="handwritingPanel" aria-label="Handwriting canvas" hidden>
            <div class="handwriting-controls" role="toolbar" aria-label="Handwriting tools">
              <span class="handwriting-label">Handwriting</span>
              <button class="toolbar-button active" id="penTool" type="button" aria-label="Use pen" aria-pressed="true" title="Pen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m4 20 4.2-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m13.8 7.4 3 3"/></svg>
              </button>
              <button class="toolbar-button" id="eraserTool" type="button" aria-label="Use eraser" aria-pressed="false" title="Eraser">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m7.5 17.5-3-3a2 2 0 0 1 0-2.8l7.2-7.2a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8l-5.2 5.2H7.5Z"/><path d="m10 7 7 7M7.5 17.5 5 20h14"/></svg>
              </button>
              <span class="toolbar-separator" aria-hidden="true"></span>
              <button class="toolbar-button" id="undoInk" type="button" title="Undo stroke" aria-label="Undo last stroke" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 7-5 5 5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg>
              </button>
              <button class="toolbar-button" id="copyInk" type="button" title="Copy handwriting" aria-label="Copy handwriting as image" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M15 9V5.5A1.5 1.5 0 0 0 13.5 4h-9A1.5 1.5 0 0 0 3 5.5v9A1.5 1.5 0 0 0 4.5 16H9"/></svg>
              </button>
              <button class="toolbar-button" id="clearInk" type="button" title="Clear handwriting" aria-label="Clear handwriting" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14"/></svg>
              </button>
              <button class="toolbar-button" id="closeHandwriting" type="button" title="Close canvas" aria-label="Close handwriting canvas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div class="canvas-wrap">
              <canvas id="handwritingCanvas" tabindex="0" aria-label="Draw handwriting here with a mouse, touch, or stylus"></canvas>
            </div>
          </section>

          <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true" data-placeholder="Start writing…"></div>
        </article>
      </div>

      <section class="empty-editor" id="emptyEditor" aria-label="No note selected">
        <div class="empty-editor-content">
          <p>No note selected</p>
          <button class="primary-button" id="emptyNewNote" type="button">Create a note</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'quiet-notes-v1';
      const THEME_KEY = 'quiet-notes-theme';
      const allowedTags = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'H2', 'H3', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'A', 'HR', 'DIV']);
      const state = { notes: [], activeId: null, saveTimer: null, query: '', handwritingOpen: false };
      const inkState = { tool: 'pen', pointerId: null, currentStroke: null, dirty: false };

      const $ = (selector) => document.querySelector(selector);
      const elements = {
        sidebar: $('#sidebar'),
        backdrop: $('#backdrop'),
        noteList: $('#noteList'),
        search: $('#search'),
        clearSearch: $('#clearSearch'),
        title: $('#title'),
        editor: $('#editor'),
        noteMeta: $('#noteMeta'),
        saveStatus: $('#saveStatus'),
        editorShell: $('#editorShell'),
        emptyEditor: $('#emptyEditor'),
        themeButton: $('#themeButton'),
        handwritingPanel: $('#handwritingPanel'),
        handwritingCanvas: $('#handwritingCanvas'),
        toggleHandwriting: $('#toggleHandwriting'),
        penTool: $('#penTool'),
        eraserTool: $('#eraserTool'),
        undoInk: $('#undoInk'),
        copyInk: $('#copyInk'),
        clearInk: $('#clearInk')
      };

      function makeId() {
        return (crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`);
      }

      function plainText(html) {
        const container = document.createElement('div');
        container.innerHTML = html;
        return (container.textContent || '').replace(/\s+/g, ' ').trim();
      }

      function readableUrl(url) {
        try {
          return decodeURI(String(url));
        } catch (error) {
          return String(url);
        }
      }

      function normalizeLinkLabels(root) {
        root.querySelectorAll('a[href]').forEach((link) => {
          const href = link.getAttribute('href');
          const label = (link.textContent || '').trim();
          if (!href || !/^https?:\/\//i.test(label)) return;

          try {
            if (new URL(label).href === new URL(href, window.location.href).href) {
              link.textContent = readableUrl(label);
            }
          } catch (error) {
            // Leave malformed or intentionally custom link labels unchanged.
          }
        });
      }

      function sanitizeHtml(html) {
        const template = document.createElement('template');
        template.innerHTML = String(html || '');
        const nodes = [...template.content.querySelectorAll('*')];
        nodes.forEach((node) => {
          if (!allowedTags.has(node.tagName)) {
            node.replaceWith(...node.childNodes);
            return;
          }
          const href = node.tagName === 'A' ? node.getAttribute('href') : null;
          [...node.attributes].forEach((attribute) => node.removeAttribute(attribute.name));
          if (node.tagName === 'A') {
            if (href && /^(https?:|mailto:)/i.test(href)) {
              node.setAttribute('href', href);
              node.setAttribute('target', '_blank');
              node.setAttribute('rel', 'noopener noreferrer');
            }
          }
        });
        normalizeLinkLabels(template.content);
        return template.innerHTML;
      }

      function insertUrl(url) {
        const selection = window.getSelection();
        if (!selection?.rangeCount) return false;
        const range = selection.getRangeAt(0);
        if (!elements.editor.contains(range.commonAncestorContainer)) return false;

        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = readableUrl(url);
        range.deleteContents();
        range.insertNode(link);
        range.setStartAfter(link);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
        return true;
      }

      function pasteReadableUrl(event) {
        const text = event.clipboardData?.getData('text/plain').trim();
        if (!text || /\s/.test(text)) return;

        try {
          const url = new URL(text);
          if (!['http:', 'https:'].includes(url.protocol)) return;
        } catch (error) {
          return;
        }

        if (!insertUrl(text)) return;
        event.preventDefault();
        updateActiveNote();
      }

      function sanitizeInk(ink) {
        if (!Array.isArray(ink)) return [];
        return ink.slice(-2000).map((stroke) => {
          if (!stroke || !Array.isArray(stroke.points)) return null;
          const points = stroke.points.slice(0, 12000).map((point) => {
            const x = Number(point?.x);
            const y = Number(point?.y);
            const pressure = Number(point?.p);
            if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
            return {
              x: Math.min(1, Math.max(0, x)),
              y: Math.min(1, Math.max(0, y)),
              p: Number.isFinite(pressure) ? Math.min(1, Math.max(0, pressure)) : 0.5
            };
          }).filter(Boolean);
          if (!points.length) return null;
          return {
            width: Math.min(8, Math.max(1, Number(stroke.width) || 2.4)),
            points
          };
        }).filter(Boolean);
      }

      function getActiveNote() {
        return state.notes.find((note) => note.id === state.activeId) || null;
      }

      function saveNow() {
        clearTimeout(state.saveTimer);
        state.saveTimer = null;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ notes: state.notes, activeId: state.activeId }));
          elements.saveStatus.textContent = 'Saved locally';
        } catch (error) {
          elements.saveStatus.textContent = 'Could not save';
        }
      }

      function scheduleSave() {
        elements.saveStatus.textContent = 'Saving…';
        clearTimeout(state.saveTimer);
        state.saveTimer = setTimeout(saveNow, 450);
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
      }

      function formatListTime(timestamp) {
        const date = new Date(timestamp);
        const today = new Date();
        if (date.toDateString() === today.toDateString()) {
          return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }

      function formatFullTime(timestamp) {
        return new Date(timestamp).toLocaleString([], {
          month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
        });
      }

      function wordCount(html) {
        const text = plainText(html);
        return text ? text.split(/\s+/).length : 0;
      }

      function renderList() {
        const query = state.query.trim().toLocaleLowerCase();
        const filtered = [...state.notes]
          .sort((a, b) => b.updatedAt - a.updatedAt)
          .filter((note) => `${note.title} ${plainText(note.content)}`.toLocaleLowerCase().includes(query));

        if (!filtered.length) {
          elements.noteList.innerHTML = `<div class="list-empty">${query ? 'No notes match your search.' : 'No notes yet.'}</div>`;
          return;
        }

        elements.noteList.innerHTML = filtered.map((note) => {
          const title = note.title.trim() || 'Untitled';
          const preview = plainText(note.content) || (note.ink?.length ? `${note.ink.length} handwritten ${note.ink.length === 1 ? 'stroke' : 'strokes'}` : 'Empty note');
          const active = note.id === state.activeId ? ' active' : '';
          return `<button class="note-item${active}" type="button" data-id="${escapeHtml(note.id)}" aria-current="${note.id === state.activeId ? 'page' : 'false'}">
            <span class="note-item-title">${escapeHtml(title)}</span>
            <span class="note-item-preview">${escapeHtml(formatListTime(note.updatedAt))} · ${escapeHtml(preview)}</span>
          </button>`;
        }).join('');
      }

      function renderMeta(note) {
        const words = wordCount(note.content);
        const strokes = note.ink?.length || 0;
        const inkMeta = strokes ? ` · ${strokes} handwritten ${strokes === 1 ? 'stroke' : 'strokes'}` : '';
        elements.noteMeta.textContent = `Edited ${formatFullTime(note.updatedAt)} · ${words} ${words === 1 ? 'word' : 'words'}${inkMeta}`;
      }

      function renderActiveNote() {
        const note = getActiveNote();
        const hasNote = Boolean(note);
        elements.editorShell.classList.toggle('no-note', !hasNote);
        elements.emptyEditor.classList.toggle('visible', !hasNote);
        $('#deleteNote').disabled = !hasNote;
        $('#printNote').disabled = !hasNote;
        elements.toggleHandwriting.disabled = !hasNote;

        if (!note) {
          elements.title.value = '';
          elements.editor.innerHTML = '';
          elements.noteMeta.textContent = '';
          setHandwritingOpen(false);
          return;
        }

        elements.title.value = note.title;
        elements.editor.innerHTML = sanitizeHtml(note.content);
        renderMeta(note);
        setHandwritingOpen(Boolean(note.ink?.length));
      }

      function closeSidebar() {
        elements.sidebar.classList.remove('open');
        elements.backdrop.classList.remove('visible');
      }

      function selectNote(id) {
        if (!state.notes.some((note) => note.id === id)) return;
        state.activeId = id;
        renderList();
        renderActiveNote();
        saveNow();
        closeSidebar();
      }

      function createNote() {
        const now = Date.now();
        const note = { id: makeId(), title: '', content: '', ink: [], createdAt: now, updatedAt: now };
        state.notes.push(note);
        state.activeId = note.id;
        state.query = '';
        elements.search.value = '';
        elements.clearSearch.classList.remove('visible');
        renderList();
        renderActiveNote();
        saveNow();
        closeSidebar();
        requestAnimationFrame(() => elements.title.focus());
      }

      function updateActiveNote() {
        const note = getActiveNote();
        if (!note) return;
        note.title = elements.title.value;
        note.content = sanitizeHtml(elements.editor.innerHTML);
        note.updatedAt = Date.now();
        renderList();
        renderMeta(note);
        scheduleSave();
      }

      function deleteActiveNote() {
        const note = getActiveNote();
        if (!note) return;
        const title = note.title.trim() || 'Untitled';
        if (!window.confirm(`Delete “${title}”? This cannot be undone.`)) return;
        state.notes = state.notes.filter((item) => item.id !== note.id);
        state.activeId = [...state.notes].sort((a, b) => b.updatedAt - a.updatedAt)[0]?.id || null;
        renderList();
        renderActiveNote();
        saveNow();
      }

      function load() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(stored?.notes)) {
            state.notes = stored.notes
              .filter((note) => note && typeof note.id === 'string')
              .map((note) => ({
                id: note.id,
                title: String(note.title || ''),
                content: sanitizeHtml(note.content),
                ink: sanitizeInk(note.ink),
                createdAt: Number(note.createdAt) || Date.now(),
                updatedAt: Number(note.updatedAt) || Date.now()
              }));
            state.activeId = state.notes.some((note) => note.id === stored.activeId)
              ? stored.activeId
              : state.notes[0]?.id || null;
          }
        } catch (error) {
          state.notes = [];
        }

        if (!state.notes.length) {
          const now = Date.now();
          const welcome = {
            id: makeId(),
            title: 'Welcome to Notes',
            content: '<p>This page saves your notes automatically in this browser.</p><p>Create a new note with the <strong>+</strong> button, use the toolbar to format your writing, and export a backup whenever you like.</p>',
            ink: [],
            createdAt: now,
            updatedAt: now
          };
          state.notes = [welcome];
          state.activeId = welcome.id;
          saveNow();
        }
      }

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
        const dark = theme === 'dark';
        elements.themeButton.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
        document.querySelector('meta[name="theme-color"]').content = dark ? '#181715' : '#f6f1e8';
        redrawInk();
      }

      function initializeTheme() {
        const stored = localStorage.getItem(THEME_KEY);
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        setTheme(stored === 'dark' || stored === 'light' ? stored : preferred);
      }

      function inkColor() {
        return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#28241f';
      }

      function canvasSize() {
        const rect = elements.handwritingCanvas.getBoundingClientRect();
        return { width: rect.width, height: rect.height };
      }

      function drawStroke(context, stroke, width, height, color = inkColor()) {
        const points = stroke.points;
        if (!points.length || !width || !height) return;
        context.strokeStyle = color;
        context.fillStyle = color;
        context.lineCap = 'round';
        context.lineJoin = 'round';

        if (points.length === 1) {
          const point = points[0];
          const radius = stroke.width * (0.55 + point.p * 0.6) / 2;
          context.beginPath();
          context.arc(point.x * width, point.y * height, radius, 0, Math.PI * 2);
          context.fill();
          return;
        }

        for (let index = 1; index < points.length; index += 1) {
          const previous = points[index - 1];
          const point = points[index];
          context.lineWidth = stroke.width * (0.55 + ((previous.p + point.p) / 2) * 0.75);
          context.beginPath();
          context.moveTo(previous.x * width, previous.y * height);
          context.lineTo(point.x * width, point.y * height);
          context.stroke();
        }
      }

      function redrawInk(colorOverride) {
        const canvas = elements.handwritingCanvas;
        const { width, height } = canvasSize();
        if (!width || !height) return;
        const ratio = Math.min(window.devicePixelRatio || 1, 3);
        const pixelWidth = Math.round(width * ratio);
        const pixelHeight = Math.round(height * ratio);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        const context = canvas.getContext('2d');
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, width, height);
        const note = getActiveNote();
        (note?.ink || []).forEach((stroke) => drawStroke(context, stroke, width, height, colorOverride));
      }

      function updateInkControls() {
        const hasInk = Boolean(getActiveNote()?.ink?.length);
        elements.undoInk.disabled = !hasInk;
        elements.copyInk.disabled = !hasInk;
        elements.clearInk.disabled = !hasInk;
        elements.handwritingPanel.classList.toggle('has-ink', hasInk);
      }

      function setHandwritingOpen(open) {
        const shouldOpen = Boolean(open && getActiveNote());
        state.handwritingOpen = shouldOpen;
        elements.handwritingPanel.hidden = !shouldOpen;
        elements.toggleHandwriting.classList.toggle('active', shouldOpen);
        elements.toggleHandwriting.setAttribute('aria-expanded', String(shouldOpen));
        elements.toggleHandwriting.setAttribute('aria-label', shouldOpen ? 'Close handwriting canvas' : 'Open handwriting canvas');
        updateInkControls();
        if (shouldOpen) requestAnimationFrame(() => redrawInk());
      }

      function setInkTool(tool) {
        inkState.tool = tool === 'eraser' ? 'eraser' : 'pen';
        const penActive = inkState.tool === 'pen';
        elements.penTool.classList.toggle('active', penActive);
        elements.eraserTool.classList.toggle('active', !penActive);
        elements.penTool.setAttribute('aria-pressed', String(penActive));
        elements.eraserTool.setAttribute('aria-pressed', String(!penActive));
        elements.handwritingCanvas.classList.toggle('eraser-active', !penActive);
      }

      function pointerPoint(event) {
        const rect = elements.handwritingCanvas.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height)),
          p: event.pressure > 0 ? event.pressure : 0.5
        };
      }

      function segmentDistanceSquared(pointX, pointY, startX, startY, endX, endY) {
        const deltaX = endX - startX;
        const deltaY = endY - startY;
        if (!deltaX && !deltaY) return ((pointX - startX) ** 2) + ((pointY - startY) ** 2);
        const amount = Math.max(0, Math.min(1,
          (((pointX - startX) * deltaX) + ((pointY - startY) * deltaY)) / ((deltaX ** 2) + (deltaY ** 2))
        ));
        const nearestX = startX + amount * deltaX;
        const nearestY = startY + amount * deltaY;
        return ((pointX - nearestX) ** 2) + ((pointY - nearestY) ** 2);
      }

      function eraseAt(point) {
        const note = getActiveNote();
        if (!note?.ink?.length) return false;
        const { width, height } = canvasSize();
        const pointerX = point.x * width;
        const pointerY = point.y * height;
        const thresholdSquared = 14 ** 2;

        for (let strokeIndex = note.ink.length - 1; strokeIndex >= 0; strokeIndex -= 1) {
          const points = note.ink[strokeIndex].points;
          let hit = false;
          if (points.length === 1) {
            const only = points[0];
            hit = segmentDistanceSquared(pointerX, pointerY, only.x * width, only.y * height, only.x * width, only.y * height) <= thresholdSquared;
          } else {
            for (let index = 1; index < points.length; index += 1) {
              const start = points[index - 1];
              const end = points[index];
              if (segmentDistanceSquared(pointerX, pointerY, start.x * width, start.y * height, end.x * width, end.y * height) <= thresholdSquared) {
                hit = true;
                break;
              }
            }
          }
          if (hit) {
            note.ink.splice(strokeIndex, 1);
            return true;
          }
        }
        return false;
      }

      function commitInkChange() {
        if (!inkState.dirty) return;
        const note = getActiveNote();
        if (!note) return;
        note.updatedAt = Date.now();
        inkState.dirty = false;
        updateInkControls();
        renderList();
        renderMeta(note);
        scheduleSave();
      }

      function startInk(event) {
        if (event.button !== undefined && event.button !== 0) return;
        const note = getActiveNote();
        if (!note) return;
        event.preventDefault();
        elements.handwritingCanvas.setPointerCapture(event.pointerId);
        inkState.pointerId = event.pointerId;
        inkState.dirty = false;
        const point = pointerPoint(event);

        if (inkState.tool === 'eraser') {
          inkState.dirty = eraseAt(point);
          if (inkState.dirty) redrawInk();
          return;
        }

        const stroke = { width: 2.4, points: [point] };
        note.ink ||= [];
        note.ink.push(stroke);
        inkState.currentStroke = stroke;
        inkState.dirty = true;
        redrawInk();
      }

      function moveInk(event) {
        if (event.pointerId !== inkState.pointerId) return;
        event.preventDefault();
        const events = typeof event.getCoalescedEvents === 'function' ? event.getCoalescedEvents() : [event];

        if (inkState.tool === 'eraser') {
          let erased = false;
          events.forEach((item) => { erased = eraseAt(pointerPoint(item)) || erased; });
          if (erased) {
            inkState.dirty = true;
            redrawInk();
          }
          return;
        }

        if (!inkState.currentStroke) return;
        events.forEach((item) => inkState.currentStroke.points.push(pointerPoint(item)));
        redrawInk();
      }

      function endInk(event) {
        if (event.pointerId !== inkState.pointerId) return;
        if (elements.handwritingCanvas.hasPointerCapture(event.pointerId)) {
          elements.handwritingCanvas.releasePointerCapture(event.pointerId);
        }
        inkState.pointerId = null;
        inkState.currentStroke = null;
        commitInkChange();
      }

      function undoInk() {
        const note = getActiveNote();
        if (!note?.ink?.length) return;
        note.ink.pop();
        inkState.dirty = true;
        redrawInk();
        commitInkChange();
      }

      async function copyInk() {
        const note = getActiveNote();
        if (!note?.ink?.length) return;

        try {
          if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') {
            throw new Error('Image clipboard is not supported');
          }

          const { width, height } = canvasSize();
          if (!width || !height) throw new Error('Canvas is not visible');
          const scale = Math.min(Math.max(window.devicePixelRatio || 1, 2), 3);
          const copyCanvas = document.createElement('canvas');
          copyCanvas.width = Math.round(width * scale);
          copyCanvas.height = Math.round(height * scale);
          const context = copyCanvas.getContext('2d');
          const styles = getComputedStyle(document.documentElement);
          context.scale(scale, scale);
          context.fillStyle = styles.getPropertyValue('--paper').trim() || '#fffdf8';
          context.fillRect(0, 0, width, height);
          context.strokeStyle = styles.getPropertyValue('--line').trim() || '#d8d0c3';
          context.lineWidth = 1;
          for (let y = 36; y < height; y += 36) {
            context.beginPath();
            context.moveTo(0, y - 0.5);
            context.lineTo(width, y - 0.5);
            context.stroke();
          }
          note.ink.forEach((stroke) => drawStroke(context, stroke, width, height));

          const blob = await new Promise((resolve, reject) => {
            copyCanvas.toBlob((result) => result ? resolve(result) : reject(new Error('Could not create image')), 'image/png');
          });
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          elements.saveStatus.textContent = 'Handwriting copied';
        } catch (error) {
          elements.saveStatus.textContent = 'Could not copy handwriting';
        }
      }

      function clearInk() {
        const note = getActiveNote();
        if (!note?.ink?.length) return;
        if (!window.confirm('Clear all handwriting from this note?')) return;
        note.ink = [];
        inkState.dirty = true;
        redrawInk();
        commitInkChange();
      }

      function applyFormatting(button) {
        elements.editor.focus();
        if (button.dataset.command) document.execCommand(button.dataset.command, false, null);
        if (button.dataset.block) document.execCommand('formatBlock', false, button.dataset.block);
        updateActiveNote();
        updateToolbarState();
      }

      function updateToolbarState() {
        document.querySelectorAll('[data-command]').forEach((button) => {
          const command = button.dataset.command;
          if (['bold', 'italic', 'underline', 'strikeThrough', 'insertUnorderedList', 'insertOrderedList'].includes(command)) {
            button.classList.toggle('active', document.queryCommandState(command));
          }
        });
      }

      function exportNotes() {
        saveNow();
        const data = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), notes: state.notes }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `notes-backup-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
        elements.saveStatus.textContent = 'Backup exported';
      }

      async function importNotes(file) {
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (!Array.isArray(data.notes)) throw new Error('Invalid backup');
          const imported = data.notes.map((note) => ({
            id: makeId(),
            title: String(note.title || ''),
            content: sanitizeHtml(note.content),
            ink: sanitizeInk(note.ink),
            createdAt: Number(note.createdAt) || Date.now(),
            updatedAt: Number(note.updatedAt) || Date.now()
          }));
          if (!imported.length) throw new Error('Empty backup');
          state.notes.push(...imported);
          state.activeId = imported[0].id;
          renderList();
          renderActiveNote();
          saveNow();
          elements.saveStatus.textContent = `${imported.length} ${imported.length === 1 ? 'note' : 'notes'} imported`;
        } catch (error) {
          window.alert('That file is not a valid Notes backup.');
        } finally {
          $('#importFile').value = '';
        }
      }

      $('#newNote').addEventListener('click', createNote);
      $('#emptyNewNote').addEventListener('click', createNote);
      $('#deleteNote').addEventListener('click', deleteActiveNote);
      $('#printNote').addEventListener('click', () => window.print());
      $('#exportNotes').addEventListener('click', exportNotes);
      $('#importNotes').addEventListener('click', () => $('#importFile').click());
      $('#importFile').addEventListener('change', (event) => importNotes(event.target.files[0]));

      elements.toggleHandwriting.addEventListener('click', () => setHandwritingOpen(!state.handwritingOpen));
      $('#closeHandwriting').addEventListener('click', () => setHandwritingOpen(false));
      elements.penTool.addEventListener('click', () => setInkTool('pen'));
      elements.eraserTool.addEventListener('click', () => setInkTool('eraser'));
      elements.undoInk.addEventListener('click', undoInk);
      elements.copyInk.addEventListener('click', copyInk);
      elements.clearInk.addEventListener('click', clearInk);
      elements.handwritingCanvas.addEventListener('pointerdown', startInk);
      elements.handwritingCanvas.addEventListener('pointermove', moveInk);
      elements.handwritingCanvas.addEventListener('pointerup', endInk);
      elements.handwritingCanvas.addEventListener('pointercancel', endInk);

      elements.noteList.addEventListener('click', (event) => {
        const item = event.target.closest('.note-item');
        if (item) selectNote(item.dataset.id);
      });

      // IME (Chinese/Japanese/Korean) support: while a candidate is being
      // composed the DOM holds half-finished pinyin, so hold off on
      // normalising/saving until the composition is committed.
      let composing = false;
      const compositionTargets = [elements.title, elements.editor];
      compositionTargets.forEach((el) => {
        el.addEventListener('compositionstart', () => { composing = true; });
        el.addEventListener('compositionend', () => {
          composing = false;
          if (el === elements.editor) normalizeLinkLabels(elements.editor);
          updateActiveNote();
        });
      });

      elements.title.addEventListener('input', () => {
        if (composing) return;
        updateActiveNote();
      });
      elements.editor.addEventListener('paste', pasteReadableUrl);
      elements.editor.addEventListener('input', () => {
        if (composing) return;
        normalizeLinkLabels(elements.editor);
        updateActiveNote();
      });
      elements.editor.addEventListener('keyup', updateToolbarState);
      elements.editor.addEventListener('mouseup', updateToolbarState);

      $('#formatToolbar').addEventListener('mousedown', (event) => event.preventDefault());
      $('#formatToolbar').addEventListener('click', (event) => {
        const button = event.target.closest('.toolbar-button');
        if (button?.matches('[data-command], [data-block]')) applyFormatting(button);
      });

      elements.search.addEventListener('input', () => {
        state.query = elements.search.value;
        elements.clearSearch.classList.toggle('visible', Boolean(state.query));
        renderList();
      });

      elements.clearSearch.addEventListener('click', () => {
        elements.search.value = '';
        state.query = '';
        elements.clearSearch.classList.remove('visible');
        renderList();
        elements.search.focus();
      });

      elements.themeButton.addEventListener('click', () => {
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      $('#menuButton').addEventListener('click', () => {
        elements.sidebar.classList.add('open');
        elements.backdrop.classList.add('visible');
      });
      elements.backdrop.addEventListener('click', closeSidebar);

      document.addEventListener('keydown', (event) => {
        const modifier = event.ctrlKey || event.metaKey;
        if (modifier && event.shiftKey && event.key.toLowerCase() === 'n') {
          event.preventDefault();
          createNote();
        }
        if (modifier && event.key.toLowerCase() === 's') {
          event.preventDefault();
          saveNow();
        }
        if (modifier && event.key.toLowerCase() === 'z' && document.activeElement === elements.handwritingCanvas) {
          event.preventDefault();
          undoInk();
        }
        if (event.key === 'Escape') closeSidebar();
      });

      window.addEventListener('beforeunload', saveNow);
      window.addEventListener('beforeprint', () => redrawInk('#111111'));
      window.addEventListener('afterprint', () => redrawInk());
      window.addEventListener('resize', () => redrawInk());

      if ('ResizeObserver' in window) {
        new ResizeObserver(() => {
          if (state.handwritingOpen) redrawInk();
        }).observe(elements.handwritingPanel.querySelector('.canvas-wrap'));
      }

      initializeTheme();
      load();
      renderList();
      renderActiveNote();
    })();
  </script>
</body>
</html>
